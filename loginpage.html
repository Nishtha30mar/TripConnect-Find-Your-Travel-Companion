<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripConnect - Welcome Back</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
        }

        .login-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .login-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.15);
        }

        .card-header {
            background: linear-gradient(135deg, #3498db, #2ecc71);
            padding: 40px 30px;
            text-align: center;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .card-header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            animation: shine 3s infinite linear;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        .logo {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 10px;
            position: relative;
            z-index: 2;
            background: linear-gradient(to right, #ffffff, #e0f7fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        .logo span {
            color: #2ecc71;
        }

        .tagline {
            font-size: 14px;
            opacity: 0.9;
            letter-spacing: 1px;
            position: relative;
            z-index: 2;
        }

        .card-body {
            padding: 40px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-weight: 500;
            font-size: 14px;
        }

        .input-group {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #7f8c8d;
            font-size: 16px;
        }

        .form-input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            border: 2px solid #e8f0fe;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s;
            background: #f8fafc;
        }

        .form-input:focus {
            outline: none;
            border-color: #3498db;
            background: white;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #7f8c8d;
            cursor: pointer;
            font-size: 16px;
            padding: 5px;
            transition: color 0.3s;
        }

        .password-toggle:hover {
            color: #3498db;
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .checkbox-label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            border: 2px solid #3498db;
            cursor: pointer;
        }

        .forgot-link {
            color: #3498db;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .forgot-link:hover {
            color: #2980b9;
            text-decoration: underline;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #3498db, #2ecc71);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(52, 152, 219, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .divider {
            text-align: center;
            margin: 30px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: #e8f0fe;
        }

        .divider span {
            background: white;
            padding: 0 15px;
            color: #7f8c8d;
            font-size: 14px;
        }

        .social-login {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .social-btn {
            padding: 12px;
            border: 2px solid #e8f0fe;
            background: white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
            font-size: 14px;
        }

        .social-btn:hover {
            border-color: #3498db;
            transform: translateY(-2px);
        }

        .social-btn.google {
            color: #DB4437;
        }

        .social-btn.facebook {
            color: #4267B2;
        }

        .register-link {
            text-align: center;
            color: #7f8c8d;
            font-size: 14px;
            margin-top: 20px;
        }

        .register-link a {
            color: #3498db;
            text-decoration: none;
            font-weight: 600;
            margin-left: 5px;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #3498db;
            text-decoration: none;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        @media (max-width: 480px) {
            .card-body {
                padding: 30px 20px;
            }
            
            .card-header {
                padding: 30px 20px;
            }
            
            .social-login {
                grid-template-columns: 1fr;
            }
            
            .remember-forgot {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            
            .logo {
                font-size: 32px;
            }
        }

        /* Loading animation */
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <!-- Header -->
            <div class="card-header">
                <div class="logo">TripConnect</div>
                <div class="tagline">Welcome Back, Explorer</div>
            </div>

            <!-- Body -->
            <div class="card-body">
                <!-- Form -->
                <form id="loginForm">
                    <!-- Email -->
                    <div class="form-group">
                        <label class="form-label" for="email">Email Address</label>
                        <div class="input-group">
                            <div class="input-icon">✉️</div>
                            <input type="email" 
                                   id="email" 
                                   class="form-input" 
                                   placeholder="Enter your email"
                                   required>
                        </div>
                        <div class="error-message" id="emailError">Please enter a valid email address</div>
                    </div>

                    <!-- Password -->
                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <div class="input-group">
                            <div class="input-icon">🔒</div>
                            <input type="password" 
                                   id="password" 
                                   class="form-input" 
                                   placeholder="Enter your password"
                                   required>
                            <button type="button" class="password-toggle" id="togglePassword">
                                👁️
                            </button>
                        </div>
                        <div class="error-message" id="passwordError">Password must be at least 6 characters</div>
                    </div>

                    <!-- Remember & Forgot -->
                    <div class="remember-forgot">
                        <label class="checkbox-label">
                            <input type="checkbox" id="remember">
                            Remember me
                        </label>
                        <a href="#" class="forgot-link" onclick="forgotPassword()">Forgot password?</a>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="submit-btn" id="submitBtn">
                        Sign In
                    </button>
                </form>

                <!-- Divider -->
                <div class="divider">
                    <span>or continue with</span>
                </div>

                <!-- Social Login -->
                <div class="social-login">
                    <button class="social-btn google" onclick="googleLogin()">
                        <span>G</span> Google
                    </button>
                    <button class="social-btn facebook" onclick="facebookLogin()">
                        <span>f</span> Facebook
                    </button>
                </div>

                <!-- Register Link -->
                <div class="register-link">
                    Don't have an account?
                    <a href="#" onclick="goToRegister()">Create account</a>
                </div>

                <!-- Back Link -->
                <div class="back-link">
                    <a href="#" onclick="goToHome()">
                        ← Back to home
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const togglePassword = document.getElementById('togglePassword');
        const emailError = document.getElementById('emailError');
        const passwordError = document.getElementById('passwordError');
        const submitBtn = document.getElementById('submitBtn');

        // Toggle Password Visibility
        togglePassword.addEventListener('click', function() {
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
            this.textContent = type === 'password' ? '👁️' : '👁️‍🗨️';
        });

        // Email Validation
        function validateEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }

        // Password Validation
        function validatePassword(password) {
            return password.length >= 6;
        }

        // Show Error
        function showError(element, message) {
            element.textContent = message;
            element.style.display = 'block';
        }

        // Hide Error
        function hideError(element) {
            element.style.display = 'none';
        }

        // Validate Input on Change
        emailInput.addEventListener('input', function() {
            if (validateEmail(this.value)) {
                hideError(emailError);
                this.style.borderColor = '#2ecc71';
            } else {
                this.style.borderColor = '#e8f0fe';
            }
        });

        passwordInput.addEventListener('input', function() {
            if (validatePassword(this.value)) {
                hideError(passwordError);
                this.style.borderColor = '#2ecc71';
            } else {
                this.style.borderColor = '#e8f0fe';
            }
        });

        // Form Submission
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            // Get values
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const remember = document.getElementById('remember').checked;

            // Reset errors
            hideError(emailError);
            hideError(passwordError);
            emailInput.style.borderColor = '#e8f0fe';
            passwordInput.style.borderColor = '#e8f0fe';

            // Validate
            let valid = true;

            if (!validateEmail(email)) {
                showError(emailError, 'Please enter a valid email address');
                emailInput.style.borderColor = '#e74c3c';
                valid = false;
            }

            if (!validatePassword(password)) {
                showError(passwordError, 'Password must be at least 6 characters');
                passwordInput.style.borderColor = '#e74c3c';
                valid = false;
            }

            if (!valid) return;

            // Show loading
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<div class="loading"></div> Signing in...';
            submitBtn.disabled = true;

            try {
                // Simulate API call
                await new Promise(resolve => setTimeout(resolve, 1500));

                // Success
                submitBtn.innerHTML = '✓ Success!';
                submitBtn.style.background = '#2ecc71';

                // Store remember me
                if (remember) {
                    localStorage.setItem('userEmail', email);
                }

                // Redirect
                setTimeout(() => {
                    alert('Login successful! Welcome back to TripConnect.');
                    // window.location.href = '/dashboard'; // Actual redirect
                }, 1000);

            } catch (error) {
                // Error
                submitBtn.innerHTML = '✗ Failed';
                submitBtn.style.background = '#e74c3c';
                
                showError(passwordError, 'Invalid email or password');
                passwordInput.style.borderColor = '#e74c3c';

                // Reset button
                setTimeout(() => {
                    submitBtn.innerHTML = originalText;
                    submitBtn.style.background = 'linear-gradient(135deg, #3498db, #2ecc71)';
                    submitBtn.disabled = false;
                }, 2000);
            }
        });

        // Forgot Password
        function forgotPassword() {
            const email = prompt('Enter your email to reset password:');
            if (email && validateEmail(email)) {
                alert(`Password reset link sent to ${email}`);
            } else if (email) {
                alert('Please enter a valid email address');
            }
        }

        // Google Login
        function googleLogin() {
            submitBtn.innerHTML = '<div class="loading"></div> Connecting to Google...';
            setTimeout(() => {
                alert('Google login would be implemented here');
                submitBtn.innerHTML = 'Sign In';
            }, 1000);
        }

        // Facebook Login
        function facebookLogin() {
            submitBtn.innerHTML = '<div class="loading"></div> Connecting to Facebook...';
            setTimeout(() => {
                alert('Facebook login would be implemented here');
                submitBtn.innerHTML = 'Sign In';
            }, 1000);
        }

        // Register Page
        function goToRegister() {
            alert('Redirecting to registration page...');
            // window.location.href = '/register';
        }

        // Home Page
        function goToHome() {
            alert('Redirecting to home page...');
            // window.location.href = '/';
        }

        // Auto-fill if remembered
        window.addEventListener('load', () => {
            const rememberedEmail = localStorage.getItem('userEmail');
            if (rememberedEmail) {
                emailInput.value = rememberedEmail;
                document.getElementById('remember').checked = true;
            }
            emailInput.focus();
        });
    </script>
</body>
</html>
